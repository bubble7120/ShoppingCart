<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美麗購物</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}" />
</head>
<body>
  <header>
  <h1>美麗購物
    <img src="{{ url_for('static', filename='images/rose.jpg') }}" class="rose-garland">
  </h1>
    

  <nav>
    <ul>
      <li><a href="{{ url_for('index') }}">首頁</a></li>
      <li><a href="{{ url_for('category') }}">商品分類</a></li>
      <li><a href="{{ url_for('cart') }}">購物車</a></li>

      {% if session["user"] %}
        <li><span>歡迎，{{ session["user"] }}</span></li>
        <li><a href="{{ url_for('logout') }}">登出</a></li>
      {% else %}
        <li><a href="{{ url_for('login') }}">登入</a></li>
        <li><a href="{{ url_for('register') }}">註冊</a></li>
      {% endif %}
    </ul>
  </nav>
</header>

  <section class="hero">
    <h2>為你精選的美麗好物</h2>
    <p>讓日常生活充滿質感與光彩。</p>
    <a href="{{ url_for('category') }}" class="btn">立即選購</a>
  </section>

  <section class="products">
    <h3>推薦商品</h3>
    <div class="product-grid">
      <div class="product-card">
        <img src="{{ url_for('static', filename='images/product1.jpg') }}" alt="玫瑰保濕面霜" />
        <h4>玫瑰保濕面霜</h4>
        <p>NT$3,200</p>
        <form action="{{ url_for('add_to_cart') }}" method="POST">
          <input type="hidden" name="name" value="玫瑰保濕面霜" />
          <input type="hidden" name="price" value="3200" />
          <button type="submit">加入購物車</button>
        </form>
      </div>
      <div class="product-card">
        <img src="{{ url_for('static', filename='images/product2.jpg') }}" alt="絲絨護手霜" />
        <h4>絲絨護手霜</h4>
        <p>NT$2,800</p>
        <form action="{{ url_for('add_to_cart') }}" method="POST">
          <input type="hidden" name="name" value="絲絨護手霜" />
          <input type="hidden" name="price" value="2800" />
          <button type="submit">加入購物車</button>
        </form>
      </div>
    </div>
  </section>

  <footer>
    <p>&copy; 2025 美麗購物．版權所有</p>
  </footer>
</body>
</html>
